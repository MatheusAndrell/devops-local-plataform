name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for load test'
        required: true
        default: 'http://localhost:3000'
      scenario:
        description: 'Test scenario'
        required: true
        default: 'stress'
        type: choice
        options:
          - stress
          - spike
          - smoke

jobs:
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 ${{ inputs.scenario }} test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/${{ inputs.scenario }}-test.js
        env:
          BASE_URL: ${{ inputs.target_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ inputs.scenario }}
          path: results/
