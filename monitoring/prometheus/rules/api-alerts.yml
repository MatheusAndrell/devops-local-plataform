groups:
  - name: api.alerts
    interval: 30s
    rules:
      - alert: APIDown
        expr: up{job="devops-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API is down"
          description: "devops-api has been down for more than 1 minute."
          runbook: "https://github.com/your-org/devops-local-platform/blob/main/docs/runbooks/api-down.md"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m])) /
          sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High HTTP error rate"
          description: "Error rate is above 5% for the last 2 minutes (current: {{ $value | humanizePercentage }})."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)) > 1
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High P99 latency on {{ $labels.route }}"
          description: "P99 latency is above 1s for route {{ $labels.route }} (current: {{ $value | humanizeDuration }})."

      - alert: HighRequestRate
        expr: sum(rate(http_requests_total[1m])) > 100
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "High request rate"
          description: "Request rate exceeds 100 req/s."

      - alert: HighMemoryUsage
        expr: api_nodejs_heap_size_used_bytes / api_nodejs_heap_size_total_bytes > 0.90
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Node.js heap usage critical"
          description: "Heap usage is above 90% for 5 minutes."
