global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@devops-platform.local'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord-default'
  routes:
    - matchers:
        - severity="critical"
      receiver: 'discord-critical'
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: 'discord-default'
    - matchers:
        - severity="info"
      receiver: 'null'

receivers:
  - name: 'null'

  - name: 'discord-default'
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_URL__'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          {{ end }}

  - name: 'discord-critical'
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_URL__'
        send_resolved: true
        title: 'CRITICAL: {{ .CommonLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Runbook:** {{ .Annotations.runbook }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'team']
